name: if-demo
on:
  push:
    branches:
      - main
      - develop
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Run this step if branch is main
        if: github.ref == 'refs/heads/main'
        run: echo "This step is running on the main branch"
      - name: Run this step
        run: echo "Running this step"
