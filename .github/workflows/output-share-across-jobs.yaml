name: Output share across jobs
on: push
jobs:
  build:
    outputs:
      version: ${{ steps.step1.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Build step
        id: step1
        run: echo "version=1.0.0" >> $GITHUB_OUTPUT
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: deploy step
        id: deploy1
        run: echo " We are deploying App with version ${{ needs.build.outputs.version }} "
          
  
