name: Nice If example
on: push:
  branches:
    - main
    - develop
    - feature/**

jobs:
  quality_checks:
    if: startsWith(github.ref_name, 'feature') && github.event_name == 'push' 
    runs-on: ubuntu-latest
    steps:
      
      - name: Run code quality checks
        run: echo "Running code quality checks"
  dev_deploy:
    if: github.ref_name == 'develop' && github.event_name == 'push' 
    runs-on: ubuntu-latest
    steps:
      - name: Dev Deploy
        run: echo "Deploying the code to development environment"
  prod_deploy:
    if: github.ref_name == 'main' && github.event_name == 'push' 
    runs-on: ubuntu-latest
    steps:
      - name: Dev Deploy
        run: echo "Deploying the code to production environment"
  success_message_notify:
    needs: [quality_checks, dev_deploy, prod_deploy]
    if: always() && !failure() 
    runs-on: ubuntu-latest
    steps:
      - name: Notify Success
        run: echo "Success Email sent to all stakeholders"
  failure_message_notify:
    needs: [quality_checks, dev_deploy, prod_deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Failure
        run: echo "Failure Email sent to all stakeholders"